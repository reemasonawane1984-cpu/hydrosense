<!DOCTYPE html>
<html>
<head>

    <title>HydroSense Login</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #e8f5ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            color: #0077b6;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #aaa;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 95%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #0077b6;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #005f8f;
        }

        .register-button {
            background: #28a745;
        }

        .register-button:hover {
            background: #218838;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>💧 HydroSense</h1>

        <h2>Login</h2>

        <input
            type="text"
            id="username"
            placeholder="Enter Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
        >

        <button onclick="login()">
            Login
        </button>

        <button
            class="register-button"
            onclick="createAccount()"
        >
            Create Account
        </button>

        <p id="message"></p>

    </div>


    <script>

        function login() {

            let username =
                document.getElementById("username").value.trim();

            let password =
                document.getElementById("password").value;

            let message =
                document.getElementById("message");


            /* ==============================
               GRAM PANCHAYAT LOGIN
               ============================== */

            if (
                username === "Navi Gram Panchayat" &&
                password === "@Navi 234"
            ) {

                localStorage.setItem(
                    "panchayatLoggedIn",
                    "true"
                );

                window.location.href =
                    "panchayat.html";

                return;
            }


            /* ==============================
               NORMAL USER LOGIN
               ============================== */

            let savedUser =
                JSON.parse(
                    localStorage.getItem("hydrosenseUser")
                );


            if (!savedUser) {

                message.innerHTML =
                    "Account not found. Please create an account.";

                message.style.color = "red";

                return;
            }


            if (
                username !== savedUser.name ||
                password !== savedUser.password
            ) {

                message.innerHTML =
                    "Invalid username or password.";

                message.style.color = "red";

                return;
            }


            /* Normal user successfully logged in */

            localStorage.setItem(
                "loggedIn",
                "true"
            );

            window.location.href =
                "dashboard.html";

        }


        function createAccount() {

            window.location.href =
                "register.html";

        }

    </script>

</body>
</html>
